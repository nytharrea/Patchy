[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchy"
version = "0.1.0"
description = "Android APK patching pipeline (fetch, patch, sign, release) driven by GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl_cffi>=0.16.3,<0.17",
    "lxml>=6.1.3,<7",
    "tenacity>=9.1.4,<10",
    "loguru>=0.7.3,<0.8",
    "apprise>=2.0.0,<3",
    "pydantic-settings>=2.15.0,<3",
    "PyYAML>=6.0.3,<7",
]

[project.scripts]
patchy = "patchy.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patchy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 115
exclude = ["build"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["patchy"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
