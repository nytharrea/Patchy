name: Discover

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name to look up, e.g. com.reddit.frontpage (leave empty for the overview)"
        type: string
        default: ""
      query:
        description: "Search the catalog by app or package name instead (ignored when a package is given)"
        type: string
        default: ""
      limit:
        description: "Most rows to list in a table"
        type: string
        default: "20"

permissions:
  contents: read

concurrency:
  group: patchy-discover
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  discover:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Look up the Morphe catalog
        env:
          DISCOVER_PACKAGE: ${{ inputs.package }}
          DISCOVER_QUERY: ${{ inputs.query }}
          DISCOVER_LIMIT: ${{ inputs.limit || '20' }}
        run: uv run --no-sync patchy discover
