name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: "Regenerate uv.lock and open a pull request"
        type: boolean
        default: false
      autofix:
        description: "Apply ruff fixes and formatting, then open a pull request"
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  check:
    if: ${{ !inputs.refresh_lock && !inputs.autofix }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate config
        run: uv run --no-sync patchy validate

      - name: Ruff check (lint)
        run: uv run --no-sync ruff check .

      - name: Ruff check (format)
        run: uv run --no-sync ruff format --check .

      - name: mypy
        run: uv run --no-sync mypy

      - name: pytest
        run: uv run --no-sync pytest -v

  lock:
    if: ${{ inputs.refresh_lock }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Resolve dependencies
        run: uv lock --upgrade

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- uv.lock)" ]; then
            echo "uv.lock is already up to date"
            exit 0
          fi
          branch="chore/uv-lock-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add uv.lock
          git commit -m "chore: refresh uv.lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base main --head "$branch" --title "chore: refresh uv.lock" --body "Generated by the CI workflow with uv lock --upgrade."

  autofix:
    if: ${{ inputs.autofix }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply ruff fixes and formatting
        run: |
          uv run --no-sync ruff check --fix . || true
          uv run --no-sync ruff format .

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to fix"
            exit 0
          fi
          branch="chore/autofix-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "style: apply ruff fixes"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base main --head "$branch" --title "style: apply ruff fixes" --body "Generated by the CI workflow with ruff check --fix and ruff format."

  automerge:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}

    steps:
      - name: Merge Dependabot pull request
        if: env.GH_TOKEN != ''
        run: gh pr merge "$PR_URL" --squash
