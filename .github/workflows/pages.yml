name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "config/**"
      - "src/patchy/catalog/**"
      - ".github/scripts/site_catalog.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          token: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          enablement: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Assemble the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          rm -rf build/site
          mkdir -p build
          cp -R site build/site
          uv run --no-sync python .github/scripts/site_catalog.py build/site/data/catalog.json
          find build/site -name '*.html' -exec sed -i "s|__SITE_URL__|${SITE_URL%/}|g" {} +
          test -s build/site/index.html
          test -s build/site/data/catalog.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
